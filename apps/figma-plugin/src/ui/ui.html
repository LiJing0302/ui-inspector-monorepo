<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="vVoSocbJJevIlVr16rhmdb">
<head data-page-node-id="pgjrScq3yQlCCigzulVqy3">
<meta charset="utf-8" data-page-node-id="M5fSHCO14Gnh4As7Zmdqsy" />
<title>设计稿节点导出</title>
<style>/*__STYLE__*/</style>
</head>
<body data-page-node-id="rHVUv30CsEUNDIlHcFnOYP">
<header class="hd" data-page-node-id="i4mVQFg5Mz3IJ2hc3YIQDx">
  <div data-page-node-id="6TSEFJCeaFZaVSN8kLwho2">
    <div class="hd-title" data-page-node-id="Kbh3YAjTCPqIcf4VYkVctk">设计稿节点导出</div>
    <div class="hd-sub" id="file-name" data-page-node-id="cYD8b2Fl4DSU7FUOlM92YP">读取中…</div>
  </div>
  <button class="btn ghost" id="refresh" title="重新扫描页面与设计稿" data-page-node-id="ztugLAtPuuoPgjCexOjdYH">刷新</button>
</header>

<section class="sec" data-page-node-id="GJ9bdJ8JAFPpyJe10kxybL">
  <div class="sec-head" data-page-node-id="WymczyZBdUDmboD7mXqpCr"><span data-page-node-id="SLyZw4exaFckf2w2kEcXtM">导出选项</span></div>
  <div class="grid" data-page-node-id="2u9HXEBwgXfGGsOWWw7v57">
    <label class="field" data-page-node-id="eG40Xz4coNUYh9h6LQzt9m">截图倍率
      <select id="opt-scale" data-page-node-id="5Tc0z970agWxLJyG3VJY8D">
        <option value="1" data-page-node-id="i2Oz80rppXcFVliAlBjl2A">1x</option>
        <option value="2" selected data-page-node-id="V3dlV4weMQXEp9D1EQN6q3">2x</option>
        <option value="3" data-page-node-id="5QEDdhjDUg09smGeQ2crMP">3x</option>
      </select>
    </label>
    <label class="field" data-page-node-id="3MwCSiCfu4ReW83hdw0CaA">图片格式
      <select id="opt-format" data-page-node-id="7voiDypfPZuNqUHMjQLSJt">
        <option value="PNG" selected data-page-node-id="TPtuLttCiizolmWmns8U1X">PNG</option>
        <option value="JPG" data-page-node-id="tbZTxgRV42FL095T83Rkhp">JPG</option>
      </select>
    </label>
  </div>
</section>

<section class="sec mac" id="mac-panel">
  <div class="mac-head">
    <span class="mac-title">发送到 Mac 应用</span>
    <span class="mac-badge" id="mac-badge">
      <span class="mac-dot"></span>
      <span id="mac-state">未连接</span>
    </span>
    <span class="spacer"></span>
    <button class="btn compact" id="mac-connect">连接</button>
  </div>

  <!-- 未连接时不展开：没有可选项，摊开只会挤占窄面板 -->
  <div class="mac-body" id="mac-body" hidden>
    <label class="field wide">目标需求
      <select id="mac-requirement"><option value="">（未连接）</option></select>
    </label>
    <div class="mac-row">
      <span class="mac-row-lbl">重复页面</span>
      <div class="seg" role="group" aria-label="重复页面处理方式">
        <button type="button" class="seg-btn on" id="mac-conflict-skip">跳过</button>
        <button type="button" class="seg-btn" id="mac-conflict-replace">覆盖</button>
      </div>
      <span class="mac-note" id="mac-conflict-note"></span>
    </div>
  </div>

  <!-- 分段控件对 a11y 是"两个按钮"，真正被 sendToMac 读值的仍是这一个 value -->
  <input type="hidden" id="mac-conflict" value="skip" />
  <div class="mac-hint" id="mac-hint">正在连接 Mac 应用…</div>
</section>

<footer class="ft" data-page-node-id="Sb04U8vavUozsnU9hHmLb4">
  <button class="btn primary" id="export" data-page-node-id="cGX9GeRNRhZSoh1AHftnS4">导入验收平台</button>
  <div class="prog" id="prog" hidden data-page-node-id="tKUHYZUNe134GkwKDHOVJY"><div class="bar" id="bar" data-page-node-id="JNkSTq2G1D43L52qa63hVm"></div></div>
  <div class="status" id="status" data-page-node-id="o5hRMv6rZz2cZZO3RRHCRR">请选择需要导出的设计稿</div>
</footer>

<script>/*__SCRIPT__*/</script>
</body>
</html>
