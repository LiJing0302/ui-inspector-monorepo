name: ui-inspector

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:all
      - run: pnpm --filter figma-node-schema-exporter build
      - run: pnpm --filter ui-inspector-vscode-extension build

  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter screen-mirror-mac build

  rn-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter react-native-ui-acceptance type-check
      - run: pnpm --filter react-native-ui-acceptance test
      - run: mkdir -p /tmp/ui-inspector-pack && cd packages/react-native-ui-acceptance && npm pack --pack-destination /tmp/ui-inspector-pack
